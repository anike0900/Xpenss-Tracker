<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | XPENSS Tracker</title>

    <link rel="preconnect"
        href="https://fonts.googleapis.com">
    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pages/authentication.css">
    <link rel="stylesheet" href="css/pages/forgot-password.css">
</head>

<body>
    <main class="forgot-password-page">
        <section class="forgot-password-card">
            <div class="forgot-password-header">
                <h1>Forgot Password?</h1>
                <p>
                    Enter your registered email address
                    and we'll help you reset your password.
                </p>
            </div>

            <form id="forgotPasswordForm">
                <div class="form-group">
                    <label for="email">
                        Email Address
                    </label>
                    <input type="email" id="email" name="email"
                           placeholder="Enter your email" autocomplete="email" required>
                    
                    <small class="error-message" id="emailError"></small>
                </div>

                <button type="submit" id="sendResetBtn">
                   <span id="btn-text">
                     Send Reset Link
                   </span>
                    <span class="spinner" style="display: none;"  hidden>
                        Sending...
                    </span>
                </button>
            </form>

            <div class="back-to-login">
                <a href="login.html">
                    ← Back to Login
                </a>
            </div>
        </section>
    </main>

    <script src="js/toast.js"></script>
    <script src="js/forgot-password.js"></script>

</body>

</html>
