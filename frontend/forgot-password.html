<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | XPENSS Tracker</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet"
          href="css/pages/authentication.css">

</head>

<body>
<div class="auth-container">

    <div class="auth-left">

        <img
            src="images/illustrations/forgot-password.jpg"
            class="auth-illustration"
            alt="Forgot Password">

        <h1>

            Forgot Your Password?

        </h1>

        <p>

            No worries! Enter your registered email
            and we'll send you a secure reset link.

        </p>

    </div>

    <div class="auth-right">

        <div class="auth-card">

            <h2>

                Reset Password

            </h2>

            <p>

                Enter your email address.

            </p>

            <!-- Form -->
             <form id="forgotForm" class="auth-form">
                <div class="form-group">
                    <div class="input-box">
                        <input type="email" id="forgotEmail" required>

                        <label>Email Address</label>
                    </div>
                    <small class="error-message"></small>
                </div>

                <button id="forgotBtn" class="btn btn-primary auth-btn" disabled>
                    <span class="btn-text">
                        Send  Reset Link
                    </span>
                    <span class="spinner"></span>
                </button>
                
                <div class="auth-footer">
                    Remember your password?
                    <a href="login.html">
                        Back to Login
                    </a>
                </div>
             </form>

        </div>

    </div>

</div>

      <script src="js/toast.js"></script>
    <script src="js/forgot-validation.js"></script>
    <script src="js/forgot.js"></script>
</body>

</html>
