<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP | XPENSS Tracker</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pages/authentication.css">
</head>

<body>

<div class="auth-container">
    <div class="auth-left">
        <img src="images/illustrations/otp.png"
             class="auth-illustration"
             alt="OTP Verification">

        <h1>
            Verify Your Identity
        </h1>

        <p>
            We've sent a secure verification code
            to your registered email.
        </p>
    </div>

    <div class="auth-right">
        <div class="auth-card">
            <h2>OTP Verification</h2>
            <p>
                Enter the 6-digit code.
            </p>

            <!--otp form-->
            <form id="otpForm" class="auth-form">
                <div class="otp-container">
                    <input
    class="otp-input"
    type="text"
    inputmode="numeric"
    pattern="[0-9]*"
    maxlength="1"
    autocomplete="one-time-code"
    aria-label="OTP digit 1">

<input
    class="otp-input"
    type="text"
    inputmode="numeric"
    pattern="[0-9]*"
    maxlength="1"
    aria-label="OTP digit 2">

<input
    class="otp-input"
    type="text"
    inputmode="numeric"
    pattern="[0-9]*"
    maxlength="1"
    aria-label="OTP digit 3">

<input
    class="otp-input"
    type="text"
    inputmode="numeric"
    pattern="[0-9]*"
    maxlength="1"
    aria-label="OTP digit 4">

<input
    class="otp-input"
    type="text"
    inputmode="numeric"
    pattern="[0-9]*"
    maxlength="1"
    aria-label="OTP digit 5">

<input
    class="otp-input"
    type="text"
    inputmode="numeric"
    pattern="[0-9]*"
    maxlength="1"
    aria-label="OTP digit 6">
                </div>

                <div class="otp-timer">
                    Code expire in
                    <span id="timer">
                        02:00
                    </span>
                </div>

                <p class="resend-text">
                    Didn't receive the code?
                    <a href="#" id="resendOtp">
                        Resend OTP
                    </a>
                </p>

                <button class="btn btn-primary auth-btn" type="submit">
                    Verify OTP
                </button>
            </form>
        </div>
    </div>
</div>

    <script src="js/otp.js"></script>
</body>

</html>
