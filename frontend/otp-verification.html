<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP | XPENSS Tracker</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pages/authentication.css">
</head>

<body>

<div class="auth-container">
    <div class="auth-left">
        <img src="images/illustrations/otp.png"
             class="auth-illustration"
             alt="OTP Verification">

        <h1>
            Verify Your Identity
        </h1>

        <p>
            We've sent a secure verification code
            to your registered email.
        </p>
    </div>

    <div class="auth-right">
        <div class="auth-card">

            <!-- FIX: this was previously a standalone block sitting
                 outside .auth-container, duplicating the heading below
                 and breaking the split-screen layout. Moved it here so
                 there's one functional header, and #userEmail (used by
                 otp.js to show the real registered email) still works. -->
            <div class="otp-header">
                <div class="otp-icon">
                    🔐
                </div>

                <h2>Verify OTP</h2>
                <p>We've sent a 6-digit verification code to</p>
                <strong id="userEmail">
                    ani********@gmail.com
                </strong>
            </div>

            <!--otp form-->
            <form id="otpForm" class="auth-form">
                <div class="otp-container">
                    <input class="otp-input" maxlength="1" inputmode="numeric" title="OTP digit 1" aria-label="OTP digit 1">
                    <input class="otp-input" maxlength="1" inputmode="numeric" title="OTP digit 2" aria-label="OTP digit 2">
                    <input class="otp-input" maxlength="1" inputmode="numeric" title="OTP digit 3" aria-label="OTP digit 3">
                    <input class="otp-input" maxlength="1" inputmode="numeric" title="OTP digit 4" aria-label="OTP digit 4">
                    <input class="otp-input" maxlength="1" inputmode="numeric" title="OTP digit 5" aria-label="OTP digit 5">
                    <input class="otp-input" maxlength="1" inputmode="numeric" title="OTP digit 6" aria-label="OTP digit 6">
                </div>

                <div class="otp-timer">
                    Code expire in
                    <span id="timer">
                        02:00
                    </span>
                </div>

                <p class="resend-text">
                    Didn't receive the code?
                    <a href="#" id="resendOtp">
                        Resend OTP
                    </a>
                </p>

                <button class="btn btn-primary auth-btn" type="submit">
                    Verify OTP
                </button>
            </form>
        </div>
    </div>
</div>

    <script src="js/otp.js"></script>
</body>

</html>
