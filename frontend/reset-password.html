<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Reset Password | XPENSS Tracker</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="css/style.css">

<link rel="stylesheet"
href="css/pages/authentication.css">

</head>
<body>
    <div class="auth-container">
        <div class="auth-left">
         <img
         src="images/illustrations/reset-password.png"
         class="auth-illustration"
         alt="Reset Password">

         <h1>Create New Password</h1>
         <p>
            Your new password must be different
            from previously used passwords.
         </p>
        </div>

        <div class="auth-right">
            <div class="auth-card">
                <div class="reset-header">
                    <div class="reset-icon">
                        🔒
                    </div>

                    <h2>Reset Password</h2>
                    <p>
                        Enter your new password below
                    </p>
                </div>
                <!--Form -->
                <form id="resetFrom" class="auth-form">
                    <!--New Password-->
                    <div class="form-group">
                        <div class="password-wrapper input-box">
                            <input type="password" id="newPassword" required>
                            <label>
                                New Password
                            </label>

                            <button type="button" class="toggle-password">
                                👁️
                            </button>
                        </div>

                        <small class="error-message"></small>
                    </div>

                    <!--strength-->
                    <div class="strength">
                        <div class="strength-bar"></div>
                    </div>
                    <p class="stregth-text">
                        Password Strength
                    </p>

                    <!--confirm-->
                    <div class="form-group">
                        <div class="password-wrapper input-box">
                            <input type="password" id="confirmPassword" required>

                            <label>
                                Confirm Password
                            </label>

                            <button type="button" class="toggle-password">
                                👁️
                            </button>
                        </div>
                         <small class="error-message"></small>
                    </div>

                    <button id="resetBtn" class="btn btn-primary auth-btn" required>
                        <span class="btn-text">
                            Update Password
                        </span>

                        <span class="spinner"></span>

                    </button>
                </form>
            </div>
        </div>
    </div>

    <script src="js/password-toggle.js"></script>
    <script src="js/password-strength.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/reset-validation.js"></script>
    <script src="js/reset.js"></script>

</body>
</html>
