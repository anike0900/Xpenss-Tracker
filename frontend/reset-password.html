<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | XPENSS Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/pages/authentication.css">
<link rel="stylesheet" href="css/pages/reset-password.css">
</head>
<body>
    <main class="reset-page">
        <div class="reset-card">
            <!--Logo-->
            <div class="logo">
                <div class="logo-icon">₹</div>
                <span>Xpenss</span>
            </div>

            <!--Icon (just the emoji badge)-->
            <div class="reset-icon">
                <div class="lock-icon">🔐</div>
            </div>

            <!--Header text (fixed: h1/p were nested INSIDE .reset-icon before,
                which is an 80x80px circle meant only for the emoji — that
                squashed the heading/paragraph into a tiny badge. Moved into
                their own .reset-header wrapper, which is what the CSS
                actually targets.) -->
            <div class="reset-header">
                <h1>Reset Password</h1>
                <p>Create a new password for your account.</p>
            </div>

            <!--Reset form-->
            <form id="resetPasswordForm">
                <!--New Password-->
                <div class="form-group">
                    <label for="newPassword">
                        New Password
                    </label>
                    <div class="input-box">
                        <input type="password" id="newPassword"
                               placeholder="Enter new password" autocomplete="new-password">
                        <button type="button" id="toggleNewPassword" class="password-toggle" aria-label="Show password">
                            👁
                        </button>
                    </div>
                    <small id="passwordError" class="error-message"></small>
                </div>

                <!--confirm password-->
                <div class="form-group">
                    <label for="confirmPassword">
                        Confirm Password
                    </label>
                    <div class="input-box">
                        <input type="password" id="confirmPassword"
                            placeholder="Confirm new password" autocomplete="new-password">
                        <button type="button" id="toggleConfirmPassword"
                                class="password-toggle" aria-label="Show password">
                            👁
                        </button>
                    </div>
                    <small id="confirmPasswordError" class="error-message"></small>
                </div>

                <!--Password Rules-->
                <div class="password-rules">
                    <p>Password must contain:</p>
                    <ul>
                        <li id="lengthRule">At least 8 characters</li>
                        <li id="letterRule">At least one letter</li>
                        <li id="numberRule">At least one number</li>
                    </ul>
                </div>

                <!--submit-->
                <button type="submit" id="resetPasswordBtn" class="reset-btn">
                    <span class="btn-text">Reset Password</span>
                    <span class="spinner" style="display:none">Resetting...</span>
                </button>
            </form>

            <!--Back Login-->
            <div class="back-login">
                <a href="login.html">← Back to Login</a>
            </div>
        </div>
    </main>

    <script src="js/reset-password.js?v=2"></script>
</body>
</html>
