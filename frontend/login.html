<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Xpenss Tracker</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Global CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pages/authentication.css">
</head>
<body>
    <div class="auth-container">
        <!--left panel-->
        <div class="auth-left">
             <img src="images/illustrations/login.png"
                 alt="Login Illustration"
                 class="auth-illustration">

             <h1>
                Welcome Back
            </h1>

            <p>
                Log in to continue managing your
                expenses and achieve your goals.
             </p>
        </div>

        <!--Right -->
        <div class="auth-right">
            <div class="auth-card">
                <h2>Sign In</h2>
                <p>Welcome back to Xpenss Tracker</p>

                <!--Login Form-->
                <form id="loginForm" class="auth-form">
                    <!--Email-->
                 <div class="form-group">
                    <div class="input-box">
                        <input type="email" id="loginEmail" name="email"
                               placeholder="Enter your email" required>

                        <label for="loginEmail">
                            Email Address
                        </label>
                    </div>
                    <small class="error-message"></small>
                 </div>

                 <!--Password-->
                 <div class="form-group">
                    <div class="password-wrapper input-box">
                        <input type="password" id="loginPassword" name="password"
                                placeholder="Enter your password" required>

                        <label for="loginPassword">
                            Password
                        </label>

                        <button type="button" class="toggle-password" aria-label="Show password">
                            <span class="eye-icon">
                                  👁️
                            </span>
                        </button>
                    </div>
                    <small class="error-message"></small>
                 </div>

                    <!--Remember-->
                    <div class="login-options">
                        <label class="remember-me">
                            <input type="checkbox" id="rememberMe">
                            <span>Remember Me</span>
                        </label>
                        <a href="forgot-password.html" class="forgot-password">
                            Forgot Password?
                        </a>
                    </div>

                    <!--Login-->
                    <button class="btn btn-primary auth-btn" id="loginBtn" type="submit">
                        <span class="btn-text">
                            Login
                        </span>

                        <span class="spinner">
                        </span>
                    </button>

                    <div class="auth-footer">
                        Don't have an account?
                        <a href="register.html">
                            Register
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>

   <script src="js/toast.js"></script>
   <script src="js/login-validation.js"></script>
   <script src="js/login.js"></script>
   <script src="js/password-toggle.js"></script>
</body>
</html>
